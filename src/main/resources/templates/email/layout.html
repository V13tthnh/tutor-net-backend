<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        table { border-collapse: collapse; }

        /* Header */
        .header-logo {
            margin: 0;
            color: #333333;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
        }
        .header-badge {
            float: right;
            font-size: 11px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-top: 6px;
        }

        /* Body */
        .body-title {
            margin: 0 0 20px 0;
            color: #333333;
            font-size: 17px;
            font-weight: bold;
        }
        .body p {
            margin: 0 0 20px 0;
            font-size: 15px;
            line-height: 1.6;
            color: #333333;
        }

        /* Info box */
        .info-box {
            background-color: #f9f9f9;
            border-left: 4px solid #333333;
            padding: 14px 18px;
            margin: 0 0 20px 0;
            font-size: 14px;
            color: #333333;
            line-height: 1.8;
        }
        .info-box .label {
            color: #666666;
            display: inline-block;
            width: 140px;
        }

        /* Badges */
        .badge-success { color: #2d7a2d; font-weight: bold; }
        .badge-danger  { color: #d9534f; font-weight: bold; }
        .badge-warning { color: #b8860b; font-weight: bold; }

        /* Rejection box */
        .rejection-box {
            background-color: #fff5f5;
            border-left: 4px solid #d9534f;
            padding: 14px 18px;
            font-size: 14px;
            color: #333333;
            line-height: 1.6;
            margin: 0 0 20px 0;
        }

        /* CTA Button */
        .btn {
            background-color: #333333;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 2px;
            display: inline-block;
            text-transform: uppercase;
        }

        /* Footer */
        .footer-cell {
            padding: 20px 40px;
            background-color: #f9f9f9;
            border-top: 1px solid #dddddd;
            color: #666666;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
</body>
</html>
